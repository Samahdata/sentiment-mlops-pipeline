version: "3.9"

services:
  # --- Shared metrics store: used by both the app (to write metrics/dataset
  # stats) and Grafana (to read them for dashboards) ---
  postgres:
    image: postgres:16-alpine
    container_name: a3_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: mlflow
      POSTGRES_PASSWORD: mlflow
      POSTGRES_DB: mlflow
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mlflow"]
      interval: 5s
      timeout: 5s
      retries: 10

  # --- MLflow tracking server: dataset + model registry, experiment UI ---
  mlflow:
    build:
      context: ./mlflow_server
    container_name: a3_mlflow
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "5000:5000"
    volumes:
      - mlflow_artifacts:/mlflow/artifacts
    command: >
      mlflow server
      --backend-store-uri postgresql://mlflow:mlflow@postgres:5432/mlflow
      --default-artifact-root /mlflow/artifacts
      --host 0.0.0.0
      --port 5000

  # --- Streamlit app: dataset/model version selector, prediction UI,
  # metrics visualization, model comparison charts ---
  app:
    build:
      context: ./mlflow_app
    container_name: a3_app
    restart: unless-stopped
    depends_on:
      - mlflow
      - postgres
    environment:
      MLFLOW_TRACKING_URI: http://mlflow:5000
      POSTGRES_HOST: postgres
      POSTGRES_DB: mlflow
      POSTGRES_USER: mlflow
      POSTGRES_PASSWORD: mlflow
    ports:
      - "8501:8501"
    volumes:
      - ./data:/app/data
      - ./models:/app/models

  # --- Grafana: reads dataset/model metrics straight from Postgres ---
  grafana:
    image: grafana/grafana:11.1.0
    container_name: a3_grafana
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro

volumes:
  pgdata:
  mlflow_artifacts:
  grafana_data:
